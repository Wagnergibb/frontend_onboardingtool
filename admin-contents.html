<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inhalte | Onboarding Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>Onboarding Admin</h1>
      <nav class="navigation" aria-label="Hauptnavigation">
        <a class="nav-button" href="admin-users.html">Benutzer</a>
        <a class="nav-button active" href="admin-contents.html">Inhalte</a>
      </nav>
      <button class="logout-button" id="logout-button" type="button">Abmelden</button>
    </aside>
    <main class="main-content">
      <section class="admin-content-page">
        <div class="admin-page-header">
          <div>
            <h2>Inhalte</h2>
            <p>Inhalte verwalten</p>
          </div>
          <button id="create-content-button" class="content-action" type="button">+ Inhalt erstellen</button>
        </div>

        <p id="content-message" class="admin-message" role="status"></p>

        <form id="create-content-form" class="create-user-panel" hidden>
          <h3>Inhalt erstellen</h3>
          <div class="admin-form-grid">
            <div class="form-group">
              <label for="content-title">Titel</label>
              <input id="content-title" name="title" type="text" required>
            </div>
            <div class="form-group">
              <label for="content-category">Kategorie</label>
              <select id="content-category" name="category" required>
                <option value="">Bitte auswählen</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="WORKPLACE">Workplace</option>
                <option value="SECURITY">Security</option>
              </select>
            </div>
            <div class="form-group form-field-full">
              <label for="content-description">Beschreibung</label>
              <textarea id="content-description" name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="content-type">Typ</label>
              <select id="content-type" name="contentType" required>
                <option value="">Bitte auswählen</option>
                <option value="PDF">PDF</option>
                <option value="LINK">LINK</option>
              </select>
            </div>
            <div class="form-group">
              <label for="content-role-tags">Rollen</label>
              <input id="content-role-tags" name="targetRoleTags" type="text" placeholder="IT, Developer, Backend">
            </div>
            <div id="link-field" class="form-group form-field-full" hidden>
              <label for="content-url">URL</label>
              <input id="content-url" name="resource" type="url" placeholder="https://example.com">
            </div>
            <div id="pdf-field" class="form-group form-field-full" hidden>
              <label for="content-file">PDF-Datei</label>
              <input id="content-file" name="file" type="file" accept="application/pdf,.pdf">
            </div>
            <div class="form-group">
              <label for="content-sort-order">Sortierung</label>
              <input id="content-sort-order" name="sortOrder" type="number" value="0">
            </div>
          </div>
          <p id="create-content-error" class="admin-error" role="alert"></p>
          <div class="admin-form-actions">
            <button id="cancel-create-content" class="secondary-button" type="button">Abbrechen</button>
            <button id="submit-create-content" class="content-action" type="submit">Speichern</button>
          </div>
        </form>

        <div id="admin-content-list" class="admin-content-list">Inhalte werden geladen...</div>
      </section>
    </main>
  </div>

  <script type="module" src="js/admin-contents.js"></script>
</body>
</html>
