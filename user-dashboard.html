<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Übersicht | Onboarding</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>Onboarding</h1>
      <nav class="navigation" aria-label="Hauptnavigation">
        <a class="nav-button active" href="user-dashboard.html">Übersicht</a>
        <a class="nav-button" href="user-contents.html">Inhalte</a>
      </nav>
      <button class="logout-button" id="logout-button" type="button">Abmelden</button>
    </aside>
    <main class="main-content">
      <section id="dashboard-content" class="dashboard-content">
        <header class="dashboard-header">
          <h2 id="dashboard-title">Übersicht</h2>
          <p id="dashboard-function">Dashboard wird geladen...</p>
          <div id="dashboard-role-tags" class="role-tags" aria-label="Rollen-Tags"></div>
        </header>
        <div class="dashboard-grid">
          <article class="dashboard-card">
            <h3>Progress</h3>
            <p id="dashboard-completed">-</p>
            <strong id="dashboard-progress-percentage">-</strong>
            <div class="progress-track" aria-label="Fortschritt">
              <div id="dashboard-progress-bar" class="progress-bar"></div>
            </div>
          </article>
          <article class="dashboard-card">
            <h3>Buddy</h3>
            <p id="dashboard-buddy">-</p>
          </article>
          <article class="dashboard-card">
            <h3>Status</h3>
            <p id="dashboard-status">-</p>
          </article>
        </div>
        <section id="next-content" class="next-content">
          <h3>Nächster Inhalt</h3>
          <div id="next-content-details">
            <p>Dashboard wird geladen...</p>
          </div>
        </section>
        <p id="dashboard-error" class="content-error" role="alert"></p>
      </section>
    </main>
  </div>

  <script type="module" src="js/user-dashboard.js"></script>
</body>
</html>
