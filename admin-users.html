<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benutzer | Onboarding Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>Onboarding Admin</h1>
      <nav class="navigation" aria-label="Hauptnavigation">
        <a class="nav-button active" href="admin-users.html">Benutzer</a>
        <a class="nav-button" href="admin-contents.html">Inhalte</a>
      </nav>
      <button class="logout-button" id="logout-button" type="button">Abmelden</button>
    </aside>
    <main class="main-content">
      <section class="admin-users-content">
        <div class="admin-page-header">
          <div>
            <h2>Benutzer</h2>
            <p>Benutzerverwaltung</p>
          </div>
          <button id="create-user-button" class="content-action" type="button">+ Benutzer erstellen</button>
        </div>

        <p id="admin-message" class="admin-message" role="status"></p>

        <form id="create-user-form" class="create-user-panel" hidden>
          <h3>Benutzer erstellen</h3>
          <div class="admin-form-grid">
            <div class="form-group">
              <label for="new-username">Username</label>
              <input id="new-username" name="username" type="text" required>
            </div>
            <div class="form-group">
              <label for="new-password">Password</label>
              <input id="new-password" name="password" type="password" required>
            </div>
            <div class="form-group">
              <label for="new-first-name">Vorname</label>
              <input id="new-first-name" name="firstName" type="text" required>
            </div>
            <div class="form-group">
              <label for="new-last-name">Nachname</label>
              <input id="new-last-name" name="lastName" type="text" required>
            </div>
            <div class="form-group">
              <label for="new-function">Funktion</label>
              <input id="new-function" name="functionName" type="text" required>
            </div>
            <div class="form-group">
              <label for="new-role-tags">Rollen</label>
              <input id="new-role-tags" name="roleTags" type="text" placeholder="IT, Developer, Backend">
            </div>
            <div class="form-group">
              <label for="new-buddy">Buddy</label>
              <input id="new-buddy" name="buddyName" type="text">
            </div>
          </div>
          <p id="create-user-error" class="admin-error" role="alert"></p>
          <div class="admin-form-actions">
            <button id="cancel-create-user" class="secondary-button" type="button">Abbrechen</button>
            <button id="submit-create-user" class="content-action" type="submit">Speichern</button>
          </div>
        </form>

        <div id="admin-user-list" class="admin-user-list">Benutzer werden geladen...</div>
      </section>
    </main>
  </div>

  <script type="module" src="js/admin-users.js"></script>
</body>
</html>
